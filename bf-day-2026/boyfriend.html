<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Heart Page</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #fff;
      overflow: hidden;
      transition: background-color 1s ease;
    }

    body.revealed {
      background-color: #ffecec;
    }

    /* ── INTRO SCREEN ── */
    #intro {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 1s ease;
    }

    #intro.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .heart-icon {
      width: 120px;
      height: 120px;
      animation: heartbeat 1.2s ease-in-out infinite;
    }

    .click-label {
      margin-top: 16px;
      font-size: 1.4rem;
      font-family: Georgia, serif;
      color: #e66767;
      letter-spacing: 0.05em;
    }

    @keyframes heartbeat {
      0%, 100% { transform: scale(1); }
      14%       { transform: scale(1.15); }
      28%       { transform: scale(1); }
      42%       { transform: scale(1.1); }
      56%       { transform: scale(1); }
    }

    /* ── REVEAL SCREEN ── */
    #reveal {
      position: absolute;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 1.2s ease 0.6s;
      pointer-events: none;
    }

    #reveal.fade-in {
      opacity: 1;
      pointer-events: auto;
    }

    #reveal img {
      max-width: 80vw;
      max-height: 80vh;
      border-radius: 16px;
      box-shadow: 0 8px 32px rgba(230, 103, 103, 0.25);
      object-fit: contain;
    }

    /* ── FLOATING HEARTS ── */
    .floating-heart {
      position: fixed;
      bottom: -60px;
      font-size: 1.6rem;
      color: #e66767;
      opacity: 0;
      animation: floatUp linear infinite;
      pointer-events: none;
      user-select: none;
    }

    @keyframes floatUp {
      0%   { transform: translateY(0) scale(1) rotate(0deg);   opacity: 0.8; }
      80%  { opacity: 0.5; }
      100% { transform: translateY(-110vh) scale(0.6) rotate(20deg); opacity: 0; }
    }
  </style>
</head>
<body>

  <!-- Intro Heart -->
  <div id="intro">
    <svg class="heart-icon" viewBox="0 0 100 90" xmlns="http://www.w3.org/2000/svg">
      <path fill="#e66767"
        d="M50 85
           C50 85 5 55 5 28
           C5 14 16 5 28 5
           C36 5 44 10 50 18
           C56 10 64 5 72 5
           C84 5 95 14 95 28
           C95 55 50 85 50 85Z"/>
    </svg>
    <p class="click-label">click me</p>
  </div>

  <!-- Reveal Image -->
  <div id="reveal">
    <!-- 🔁 Replace "your-image.jpg" with your actual image file name -->
    <img src="your-image.jpg" alt="Surprise" />
  </div>

  <script>
    const intro   = document.getElementById('intro');
    const reveal  = document.getElementById('reveal');
    const body    = document.body;
    let heartsStarted = false;

    // ── Click Handler ──
    intro.addEventListener('click', () => {
      intro.classList.add('fade-out');

      setTimeout(() => {
        intro.style.display = 'none';
        body.classList.add('revealed');
        reveal.classList.add('fade-in');

        if (!heartsStarted) {
          heartsStarted = true;
          startFloatingHearts();
        }
      }, 1000);
    });

    // ── Floating Hearts ──
    function createHeart() {
      const heart = document.createElement('div');
      heart.classList.add('floating-heart');
      heart.textContent = '♥';

      const size      = Math.random() * 1.5 + 0.8;   // 0.8–2.3rem
      const leftPos   = Math.random() * 100;          // 0–100vw
      const duration  = Math.random() * 6 + 6;        // 6–12s
      const delay     = Math.random() * 4;             // 0–4s

      heart.style.fontSize    = `${size}rem`;
      heart.style.left        = `${leftPos}vw`;
      heart.style.animationDuration  = `${duration}s`;
      heart.style.animationDelay     = `${delay}s`;

      body.appendChild(heart);

      // Remove heart after animation to keep DOM clean
      setTimeout(() => heart.remove(), (duration + delay) * 1000);
    }

    function startFloatingHearts() {
      // Create an initial burst
      for (let i = 0; i < 12; i++) createHeart();
      // Then keep spawning
      setInterval(() => createHeart(), 700);
    }
  </script>

</body>
</html>
